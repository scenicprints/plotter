# ============================================================
# CR-6 SE  ->  PEN PLOTTER
# Board: Creality v4.5.2  (STM32F103, 28KiB bootloader, USART1 PA10/PA9)
# Derived from Klipper's shipped printer-creality-cr6se-2020.cfg,
# with every heater, thermistor and fan section deleted on purpose.
#
# Mainsail will show empty temperature graphs and no extruder panel.
# That is expected. Nothing is broken.
# ============================================================

[include macros.cfg]

# ---------- MCU ----------
# TODO: replace with the real path from `ls /dev/serial/by-id/` after flashing.
[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

# ---------- Motion ----------
[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 500          # deliberately conservative; raise in Phase 11
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
rotation_distance: 40   # VERIFY empirically in Phase 4.3
microsteps: 16
endstop_pin: PC4
position_min: -5
position_endstop: -5
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB6
dir_pin: PB5
enable_pin: !PC3
rotation_distance: 40   # VERIFY empirically in Phase 4.3
microsteps: 16
endstop_pin: PC5
position_min: -2
position_endstop: -2
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PC3
rotation_distance: 8
microsteps: 16
# ---- Z HOMING: see Phase 4.4. Stock CR-6 SE has NO mechanical Z endstop.
# Currently configured for OPTION B (software Z reference, zero hardware):
# no endstop at all; PLOT_HOME sets Z by eye each session.
# For OPTION A (mechanical switch, recommended), delete the two lines below,
# uncomment endstop_pin, and set position_endstop after fitting the switch.
#endstop_pin: ^PA7      # freed filament-sensor header - ideal Z endstop input
#position_endstop: 0
endstop_pin: PA4        # strain gauge; NOT used for homing, placeholder only
position_min: -1.5
position_max: 250
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0

# ---------- Pen servo ----------
# PA6 was the stock LED output. It is free now and is the servo candidate.
# Angles are placeholders until Phase 6.4 finds them by eye.
[servo pen]
pin: PA6
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 90

# ---------- Bed mesh (Phase 7, one-time manual) ----------
[bed_mesh]
speed: 60
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 215, 215
probe_count: 5, 5

# ---------- Plumbing ----------
[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
[display_status]
[respond]
[force_move]
enable_force_move: True   # needed for SET_KINEMATIC_POSITION in PLOT_HOME

[static_digital_output daughterboard_communication]
pins: !PA5
