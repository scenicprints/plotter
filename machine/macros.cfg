# ============================================================
# Plotter macros
#
# Z0 IS THE WRITING HEIGHT AND THE ABSOLUTE FLOOR.
# stepper_z position_min is 0, so once zeroed the machine physically
# cannot command the pen lower. PEN_DOWN goes to Z0 and no further.
#
# Session ritual:
#   1. PLOT_HOME              homes X/Y, clears the old origin
#   2. jog to one corner of the paper   -> PLOT_P1
#   3. jog to the OPPOSITE corner       -> PLOT_P2
#      (sets origin to the paper CENTRE and records the sheet size)
#   4. ZROOM, then jog down with ZDOWN until the pen is writing, with
#      the carriage floating off its stop
#   5. PLOT_ZERO_HERE         locks that as Z0, the floor
#   -> ready to plot
#
# The carriage is GRAVITY LOADED. Pen force is the weight of the moving
# assembly. Change the line weight by adding or removing mass, never by
# driving Z lower - it cannot go lower.
# ============================================================

[gcode_macro _PLOT_VARS]
# Set to 1 by PLOT_ZERO_HERE. Pen moves refuse until then.
variable_zeroed:       0
# Travel height above the writing height, in mm.
variable_lift:         2.0
# Measured carriage float, mm (owner: 0.6278 in). Reference only.
variable_max_float:   15.9
# Paper size in mm, filled in by PLOT_P2.
variable_paper_w:      0.0
variable_paper_h:      0.0
variable_z_up_feed:    900
variable_z_down_feed:  600
variable_travel_feed:  9000
gcode:

[gcode_macro PEN_DOWN]
gcode:
    {% set v = printer["gcode_macro _PLOT_VARS"] %}
    {% if v.zeroed|int != 1 %}
        RESPOND MSG="REFUSED: no Z reference set. Jog to the writing height and run PLOT_ZERO_HERE first."
    {% else %}
        G90
        G1 Z0 F{v.z_down_feed}
    {% endif %}

[gcode_macro PEN_UP]
gcode:
    {% set v = printer["gcode_macro _PLOT_VARS"] %}
    {% if v.zeroed|int != 1 %}
        RESPOND MSG="REFUSED: no Z reference set. Jog to the writing height and run PLOT_ZERO_HERE first."
    {% else %}
        G90
        G1 Z{v.lift} F{v.z_up_feed}
    {% endif %}

[gcode_macro PLOT_ZERO_HERE]
description: Call with the pen AT the writing height, carriage floating. Locks this as Z0, the absolute floor.
gcode:
    {% set v = printer["gcode_macro _PLOT_VARS"] %}
    SET_KINEMATIC_POSITION Z=0
    SET_GCODE_VARIABLE MACRO=_PLOT_VARS VARIABLE=zeroed VALUE=1
    RESPOND MSG="Z0 locked at the current height. This is now the lowest the pen can go. PEN_UP travels to Z{v.lift}."

[gcode_macro PLOT_UNZERO]
description: Clear the Z reference, to set it again after moving the pen or paper.
gcode:
    SET_GCODE_VARIABLE MACRO=_PLOT_VARS VARIABLE=zeroed VALUE=0
    RESPOND MSG="Z reference cleared. Pen moves refuse until PLOT_ZERO_HERE runs again."

[gcode_macro ZROOM]
description: Give Z room to jog down, before it has been zeroed.
gcode:
    {% set v = printer["gcode_macro _PLOT_VARS"] %}
    {% if v.zeroed|int == 1 %}
        RESPOND MSG="REFUSED: Z is already zeroed at the writing height. Run PLOT_UNZERO first if you really mean to go below it."
    {% else %}
        SET_KINEMATIC_POSITION Z=200
        RESPOND MSG="Z re-declared as 200. Jog down with ZDOWN."
    {% endif %}

[gcode_macro ZDOWN]
description: Jog Z down. ZDOWN D=1 moves 1mm toward the paper.
gcode:
    {% set d = params.D|default(1)|float %}
    G91
    G1 Z-{d} F900
    G90
    RESPOND MSG="Z down {d} mm, now at {printer.toolhead.position.z|round(2)}"

[gcode_macro ZUP]
description: Jog Z up. ZUP D=1 moves 1mm away from the paper.
gcode:
    {% set d = params.D|default(1)|float %}
    G91
    G1 Z{d} F900
    G90
    RESPOND MSG="Z up {d} mm, now at {printer.toolhead.position.z|round(2)}"

[gcode_macro JOG]
description: Relative XY jog. JOG X=10 Y=-5
gcode:
    {% set x = params.X|default(0)|float %}
    {% set y = params.Y|default(0)|float %}
    G91
    G1 X{x} Y{y} F6000
    G90
    RESPOND MSG="now at X{printer.toolhead.position.x|round(1)} Y{printer.toolhead.position.y|round(1)}"

[gcode_macro GOTO]
description: Absolute XY move. GOTO X=110 Y=110
gcode:
    {% set x = params.X|default(printer.toolhead.position.x)|float %}
    {% set y = params.Y|default(printer.toolhead.position.y)|float %}
    G90
    G1 X{x} Y{y} F6000
    RESPOND MSG="now at X{x|round(1)} Y{y|round(1)}"

[gcode_macro PLOT_HOME]
description: Step 1. Home X/Y and clear any previous paper origin.
gcode:
    SET_GCODE_OFFSET X=0 Y=0
    G28 X Y
    RESPOND MSG="Homed. Jog to one corner of the paper, then run PLOT_P1."

[gcode_macro PLOT_P1]
description: Step 2. Call with the pen over ONE corner of the paper.
variable_x: 0.0
variable_y: 0.0
gcode:
    {% set p = printer.toolhead.position %}
    SET_GCODE_OFFSET X=0 Y=0
    SET_GCODE_VARIABLE MACRO=PLOT_P1 VARIABLE=x VALUE={p.x}
    SET_GCODE_VARIABLE MACRO=PLOT_P1 VARIABLE=y VALUE={p.y}
    RESPOND MSG="Corner 1 at X{p.x|round(1)} Y{p.y|round(1)}. Now jog to the OPPOSITE corner and run PLOT_P2."

[gcode_macro PLOT_P2]
description: Step 3. Call at the opposite corner. Sets centre origin and paper size.
gcode:
    {% set p = printer.toolhead.position %}
    {% set c1 = printer["gcode_macro PLOT_P1"] %}
    {% set w = (p.x - c1.x)|abs %}
    {% set h = (p.y - c1.y)|abs %}
    {% set cx = (p.x + c1.x) / 2.0 %}
    {% set cy = (p.y + c1.y) / 2.0 %}
    {% if w < 10 or h < 10 %}
        RESPOND MSG="Refused: that is only {w|round(1)} x {h|round(1)} mm. Did you move to the opposite corner?"
    {% else %}
        SET_GCODE_OFFSET X={cx} Y={cy}
        SET_GCODE_VARIABLE MACRO=_PLOT_VARS VARIABLE=paper_w VALUE={w}
        SET_GCODE_VARIABLE MACRO=_PLOT_VARS VARIABLE=paper_h VALUE={h}
        RESPOND MSG="Paper {w|round(1)} x {h|round(1)} mm, centre at machine X{cx|round(1)} Y{cy|round(1)}. Next: ZROOM, jog down with ZDOWN to the writing height, then PLOT_ZERO_HERE."
    {% endif %}

[gcode_macro PLOT_CENTER]
description: Quick alternative to P1/P2. Call with the pen at the middle of the sheet.
gcode:
    {% set p = printer.toolhead.position %}
    SET_GCODE_OFFSET X={p.x} Y={p.y}
    RESPOND MSG="Centre set at machine X{p.x|round(1)} Y{p.y|round(1)}. Paper size unknown, so pass --size WxH to plot."

[gcode_macro PLOT_START]
gcode:
    G90
    G21
    PEN_UP

[gcode_macro PLOT_END]
gcode:
    {% set v = printer["gcode_macro _PLOT_VARS"] %}
    PEN_UP
    G1 Z{v.lift + 15} F{v.z_up_feed}
    G1 Y{printer.toolhead.axis_maximum.y - 15} F{v.travel_feed}
    M84
    RESPOND MSG="Plot complete."

[gcode_macro PEN_CHANGE]
description: Between colour layers. Lifts, drops the Z reference, and pauses for a pen swap.
gcode:
    {% set v = printer["gcode_macro _PLOT_VARS"] %}
    {% set pen = params.PEN|default("the next pen") %}
    {% set i = params.INDEX|default(0)|int %}
    {% set n = params.OF|default(0)|int %}
    PEN_UP
    # Clear of the paper so the pen can be pulled out. Relative, because Z0 is
    # wherever this pen happened to write, not a fixed height.
    G91
    G1 Z20 F{v.z_up_feed}
    G90
    M400
    # The next pen is a different length, so the old Z0 is meaningless. Only the
    # FLAG is cleared here, never SET_KINEMATIC_POSITION: the pause captures the
    # current position, and redefining the frame before RESUME would send the
    # head back to a stale height. Unzeroed, PEN_DOWN refuses, so nothing can
    # draw until the new Z0 is locked by hand.
    PLOT_UNZERO
    RESPOND MSG="PEN CHANGE {i} of {n}: load {pen}. Then ZROOM, jog down with ZDOWN until it writes with the carriage floating, PLOT_ZERO_HERE, then RESUME."
    PAUSE

[gcode_macro PLOT_PAUSE]
gcode:
    PEN_UP
    PAUSE
    RESPOND MSG="Paused for pen swap. PLOT_RESUME when ready."

[gcode_macro PLOT_RESUME]
gcode:
    RESUME
    PEN_DOWN

[gcode_macro PEN_TEST]
description: Draw a 40mm square centred on the origin. Run the ritual first.
gcode:
    {% set v = printer["gcode_macro _PLOT_VARS"] %}
    {% if v.zeroed|int != 1 %}
        RESPOND MSG="REFUSED: no Z reference set. Run PLOT_ZERO_HERE first."
    {% else %}
        PEN_UP
        G1 X-20 Y-20 F{v.travel_feed}
        PEN_DOWN
        G1 X20 Y-20 F3000
        G1 X20 Y20 F3000
        G1 X-20 Y20 F3000
        G1 X-20 Y-20 F3000
        PEN_UP
        G1 X0 Y0 F{v.travel_feed}
    {% endif %}
